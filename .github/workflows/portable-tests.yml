name: Windows and Linux tests
on:
  push:
    branches:
      - main
      - feature/windows-linux-streaming
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -v
      - name: Cross-platform setup smoke test
        run: python setup.py --skip-deepseek
      - name: Check virtualenv launcher
        run: python -c "from start import PYTHON; assert PYTHON.is_file(), str(PYTHON)"
      - name: Check browser JavaScript syntax
        run: node --check static/app.js
